[project]
name = "content-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ben", email = "ben@tidemarkstudio.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyairtable>=3.5.0.post1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
content-monitor = "content_monitor:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
