[project]
name = "chickadee"
version = "0.2.0"
description = "Keeps track of what's on a website, what changed, and what needs attention."
readme = "README.md"
authors = [{ name = "ben", email = "ben@tidemarkstudio.dev" }]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "pyairtable>=3.5.0.post1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
chickadee = "chickadee.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
